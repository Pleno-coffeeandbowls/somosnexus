    <!-- ── Google Analytics 4 con Consent Mode v2 (carga diferida) ── -->
    <script>
      // Inicializar dataLayer y gtag ANTES de cargar el script de GA4
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Consent Mode v2: denegado por defecto (RGPD)
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'wait_for_update': 2000
      });

      // Cargar GA4 de forma diferida (no bloquea LCP ni TBT)
      window._ga4Loaded = false;
      window.loadGA4 = function() {
        if (window._ga4Loaded) return;
        window._ga4Loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-QPM73MDXZ8';
        document.head.appendChild(s);
        s.onload = function() {
          gtag('js', new Date());
          gtag('config', 'G-QPM73MDXZ8', { anonymize_ip: true });
        };
      };

      window.loadGA4WithConsent = function() {
        window.loadGA4();
        gtag('consent', 'update', {
          'analytics_storage': 'granted',
          'ad_storage': 'denied'
        });
      };

      // Si ya aceptó cookies antes: cargar GA4 tras 4s (no bloquea LCP)
      if (localStorage.getItem('nexus_cookie_consent') === 'accepted') {
        setTimeout(window.loadGA4WithConsent, 4000);
      } else {
        // Primera visita: cargar solo cuando el usuario interactúa
        function _ga4Init() {
          window.loadGA4();
          window.removeEventListener('scroll', _ga4Init);
          window.removeEventListener('click', _ga4Init);
          window.removeEventListener('touchstart', _ga4Init);
        }
        window.addEventListener('scroll', _ga4Init, {passive: true, once: true});
        window.addEventListener('click', _ga4Init, {once: true});
        window.addEventListener('touchstart', _ga4Init, {passive: true, once: true});
      }
    </script>
